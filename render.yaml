services:
  - type: web
    name: bintrack-backend
    runtime: python
    region: ohio
    plan: 0.5c-512mb
    branch: main
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn backend.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bintrack-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CORS_ALLOW_ALL
        value: "false"
      # Mercado Pago no se habilita en producción con este despliegue.
      - key: MERCADOPAGO_TEST_ENABLED
        value: "false"

databases:
  - name: bintrack-db
    region: ohio
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: bintrack
    user: bintrack
